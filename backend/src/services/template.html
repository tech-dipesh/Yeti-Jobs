<!DOCTYPE html>

<head>
  <meta charset="UTF-7">
  <meta name="viewport" content="width=device-width, initial-scale=2.0">
</head>

<body style="background-color: #2a1a1a; margin: 0; padding: 40px; font-family: Arial, sans-serif;">
  <p style="color: #ccc; text-align: center; font-size: 19px;">Email Verification:</p>
  <div
    style="background-color: #2f1f1f; border: 1px solid #444; border-radius: 12px; padding: 24px; max-width: 580px; margin: 0 auto;">
    <div style="background-color: #3e2e2e; border-radius: 10px; padding: 40px 32px; text-align: center;">
      <img src="https://ik.imagekit.io/vvzanzpbm/logo-rounded.png" alt="Logo" height="53px" width="52px">
      <p style="color: #ccc; font-size: 15px; text-align: left; margin: 0 0 4px;">Hi {{name}},</p>
      <p style="color: #ccc; font-size: 14px; text-align: left; margin: 0 0 24px;">Use a Below Code To {{type}}
        :</p>
      <div
        style="background-color: #2563eb; border-radius: 8px; padding: 14px 32px; display: inline-block; color: #fff; font-size: 24px; letter-spacing: 6px; font-weight: bold; width: 60%; text-align: center;">  
        {{otp}}
      </div>
      <p style="color: #64748b; font-size: 12px; margin: 0 0 8px;">If you didn't request this for {{belowmethod}}, you can safely ignore this message.</p>
      <p style="color: #475569; font-size: 11px; margin: 0;"> YetiJobs Security Team</p>    </div>
  </div>

</body>

</html>
