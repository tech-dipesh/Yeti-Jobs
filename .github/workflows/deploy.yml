name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: './frontend/pnpm-lock.yaml'

      - name: Install
        run: pnpm install --frozen-lockfile
        
      - name: Build
        run: pnpm build

      - name: Pull Vercel Environment
        run: pnx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Build Vercel Project
        run: pnx vercel@latest build --prod --cwd ./frontend --token=${{ secrets.VERCEL_TOKEN }}
  
      - name: Deploy to Vercel
        run: pnx vercel@latest deploy --prebuilt --prod --cwd ./frontend --token=${{ secrets.VERCEL_TOKEN }}